[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "nmwpm"
version = "0.1.0"
description = "Neural Minimum-Weight Perfect Matching for quantum error correction"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["quantum error correction", "surface code", "neural network", "MWPM", "decoder"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.24",
    "torch>=2.0",
    "stim>=1.14",
    "pymatching>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
nmwpm-train    = "nmwpm.train:main"
nmwpm-evaluate = "nmwpm.evaluate:main"

[project.urls]
Repository = "https://github.com/aryuc/NMWPM"

[tool.setuptools.packages.find]
where = ["."]
include = ["nmwpm*"]
